<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>H CAR DEAL</title>
<meta name="description" content="احسب تكلفة وربح كل صفقة سيارة بثقة واحترافية" />

<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="H CAR DEAL" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" href="./icon-192.png" />

<style>
  html,body,#root{height:100%;margin:0;background:#000}
  body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#000;gap:22px;
        grid-auto-flow:row;align-content:center;justify-items:center}
  #boot img{width:220px;max-width:64vw}
  #bar{width:150px;height:3px;border-radius:9px;background:rgba(255,255,255,.10);overflow:hidden}
  #bar i{display:block;height:100%;width:36%;border-radius:9px;
         background:linear-gradient(90deg,#F6DE9C,#E3B457,#B07E23);
         animation:sl 1.15s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  #boot p{margin:0;font:600 12px system-ui,sans-serif;color:#71727B}
</style>
</head>
<body>
<div id="root">
  <div id="boot">
    <img src="./splash.png" alt="H CAR DEAL" />
    <div id="bar"><i></i></div>
    <p>جارٍ التحميل…</p>
  </div>
</div>

<!-- React + محوّل JSX من CDN — لا حاجة إلى npm ولا كمبيوتر -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
<script type="text/babel" data-presets="react" src="./app.js"></script>

<script>
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__hcdInstall = e;
    window.dispatchEvent(new Event("hcd-installable"));
  });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register(
        new URL("sw.js", document.baseURI).href,
        { scope: new URL("./", document.baseURI).pathname }
      ).catch(function () {});
    });
  }
  setTimeout(function () {
    var b = document.getElementById("boot");
    if (!b) return;
    var p = b.querySelector("p");
    if (!window.React || !window.Babel) {
      p.textContent = "تعذّر تحميل المكتبات — تأكد من الإنترنت وأعد التحميل";
      p.style.color = "#E23A2E";
    } else {
      p.textContent = "جارٍ التجهيز…";
    }
  }, 6000);

  window.addEventListener("error", function (ev) {
    var b = document.getElementById("boot");
    if (!b) return;
    var p = b.querySelector("p");
    p.textContent = "خطأ: " + (ev.message || "غير معروف");
    p.style.color = "#E23A2E";
  });
</script>
</body>
</html>
